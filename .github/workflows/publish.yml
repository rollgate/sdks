name: Publish SDKs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3)"
        required: true
      dry_run:
        description: "Dry run (skip actual publish)"
        type: boolean
        default: false

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  DOTNET_VERSION: "8.0"

jobs:
  # ── npm (8 packages) ──────────────────────────────────────
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - name: Build packages in dependency order
        run: |
          npm run build --workspace=@rollgate/sdk-core
          npm run build --workspace=@rollgate/sdk-browser
          npm run build --workspace=@rollgate/sdk-node
          npm run build --workspace=@rollgate/sdk-react
          npm run build --workspace=@rollgate/sdk-vue
          npm run build --workspace=@rollgate/sdk-svelte
          npm run build --workspace=@rollgate/sdk-angular
          npm run build --workspace=@rollgate/sdk-react-native
          npm run build --workspace=@rollgate/openfeature-server-provider

      - name: Publish npm packages
        if: ${{ !inputs.dry_run }}
        run: |
          for pkg in sdk-core sdk-browser sdk-node sdk-react sdk-vue sdk-svelte sdk-angular sdk-react-native openfeature-server-provider; do
            echo "Publishing @rollgate/$pkg (version from its package.json)..."
            npm publish --workspace=packages/$pkg --access public || echo "⚠️ $pkg failed or already published"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: |
          for pkg in sdk-core sdk-browser sdk-node sdk-react sdk-vue sdk-svelte sdk-angular sdk-react-native openfeature-server-provider; do
            echo "[DRY RUN] Would publish @rollgate/$pkg (version from its package.json)"
          done

  # ── PyPI ───────────────────────────────────────────────────
  publish-pypi:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          cd packages/sdk-python
          pip install build
          python -m build

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          cd packages/sdk-python
          pip install twine
          twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ── Maven Central ──────────────────────────────────────────
  publish-maven:
    name: Publish Java SDK to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Import GPG key
        run: echo "${{ secrets.MAVEN_GPG_KEY }}" | gpg --batch --import

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_USERNAME }}</username>
                <password>${{ secrets.MAVEN_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          cd packages/sdk-java
          mvn clean deploy -P release -DskipTests -Dgpg.passphrase=""

  # ── NuGet ──────────────────────────────────────────────────
  publish-nuget:
    name: Publish .NET SDK to NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and pack
        run: |
          cd packages/sdk-dotnet/src/Rollgate.SDK
          dotnet pack -c Release

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          cd packages/sdk-dotnet/src/Rollgate.SDK
          dotnet nuget push bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # ── Go modules (git tag) ───────────────────────────────────
  publish-go:
    name: Tag Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Go module tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "packages/sdk-go/v${{ inputs.version }}" 2>/dev/null || echo "Tag packages/sdk-go/v${{ inputs.version }} already exists"
          git tag "v${{ inputs.version }}" 2>/dev/null || echo "Tag v${{ inputs.version }} already exists"
          git push origin "packages/sdk-go/v${{ inputs.version }}" "v${{ inputs.version }}" 2>/dev/null || echo "Tags already pushed"

  # ── pub.dev (Flutter) ───────────────────────────────────────
  publish-pubdev:
    name: Publish Flutter SDK to pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Setup pub.dev credentials
        run: |
          mkdir -p "$HOME/.config/dart"
          echo '${{ secrets.PUB_DEV_CREDENTIALS }}' > "$HOME/.config/dart/pub-credentials.json"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          cd packages/sdk-flutter
          dart pub publish --force

  # ── Summary ────────────────────────────────────────────────
  summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-pypi, publish-maven, publish-nuget, publish-go, publish-pubdev]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## SDK Publish Results v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| npm (9 packages) | ${{ needs.publish-npm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PyPI | ${{ needs.publish-pypi.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven Central | ${{ needs.publish-maven.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NuGet | ${{ needs.publish-nuget.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go modules | ${{ needs.publish-go.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pub.dev (Flutter) | ${{ needs.publish-pubdev.result }} |" >> $GITHUB_STEP_SUMMARY
